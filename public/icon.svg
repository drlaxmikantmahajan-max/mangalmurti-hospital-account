<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hospitalTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="crossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#hospitalTeal)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-opacity="0.3" />

  <!-- Emblem Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Hospital Medical Cross -->
    <!-- Vertical Bar -->
    <rect x="220" y="116" width="72" height="280" rx="16" fill="#ffffff" />
    <!-- Horizontal Bar -->
    <rect x="116" y="220" width="280" height="72" rx="16" fill="#ffffff" />

    <!-- Center Medical Caduceus / Heartbeat Wave Accent -->
    <circle cx="256" cy="256" r="32" fill="#0f766e" />
    <path d="M 236 256 L 246 256 L 252 242 L 260 270 L 266 256 L 276 256" fill="none" stroke="#facc15" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Hospital Monogram "MMH" Banner -->
  <rect x="136" y="380" width="240" height="48" rx="24" fill="#0f766e" stroke="#2dd4bf" stroke-width="2" />
  <text x="256" y="412" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">MMH ACCOUNTS</text>
</svg>
